<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title> Casino | Multimedia</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        
        .carrusel-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 25px;
            border: 3px solid #cc0000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .carrusel-slides {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carrusel-slide {
            min-width: 100%;
        }
        .carrusel-slide img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }
        .carrusel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: #cc0000;
            border: 1px solid #cc0000;
            font-size: 2rem;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 50%;
            transition: 0.3s;
        }
        .carrusel-btn:hover {
            background: #cc0000;
            color: white;
        }
        .btn-prev { left: 15px; }
        .btn-next { right: 15px; }
        .carrusel-dots {
            text-align: center;
            margin-top: 15px;
        }
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #bbb;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active {
            background-color: #cc0000;
            transform: scale(1.2);
        }
        /* Ajustes responsivos */
        @media (max-width: 600px) {
            .carrusel-slide img { height: 250px; }
            .carrusel-btn { font-size: 1.5rem; padding: 5px 10px; }
        }
        /* Modo oscuro - ajustes específicos del carrusel (opcional, el CSS global ya lo cubre) */
        body.modo-oscuro .carrusel-btn {
            background: rgba(0,0,0,0.8);
            color: #ff6666;
        }
        body.modo-oscuro .carrusel-btn:hover {
            background: #ff4444;
            color: black;
        }
        body.modo-oscuro .dot {
            background-color: #555;
        }
        body.modo-oscuro .dot.active {
            background-color: #ff6666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header-principal">
            <h1> CASINO </h1>
            <div class="nav-pestanas">
                <a href="index.html" class="pestana-link"> INICIO</a>
                <a href="historia.html" class="pestana-link"> HISTORIA</a>
                <a href="tabla.html" class="pestana-link"> SLOTS</a>
                <a href="formulario.html" class="pestana-link"> REGISTRO VIP</a>
                <a href="multimedia.html" class="pestana-link activo"> MULTIMEDIA</a>
                <a href="crud-completo.html" class="pestana-link"> CRUD JUEGOS</a>
            </div>
        </header>

        <main class="seccion-principal">
            <h2> Galería de emociones</h2>
            <p>Disfruta del ambiente único de nuestro casino a través de estas imágenes.</p>

            <!-- CARRUSEL DE FOTOS -->
            <div class="carrusel-container">
                <div class="carrusel-slides" id="carruselSlides">
                    <div class="carrusel-slide">
                        <img src="img/mesa.jpg" alt="Casino clásico">
                    </div>
                    <div class="carrusel-slide">
                        <img src="img/rul.jpg" alt="Máquina tragamonedas">
                    </div>
                    <div class="carrusel-slide">
                        <img src="img/tragamonedas.png" alt="Mesa de póker">
                    </div>
                    <div class="carrusel-slide">
                        <img src="img/fichas.jpg" alt="Ruleta">
                    </div>
            
                </div>
                <button class="carrusel-btn btn-prev" id="btnPrev">❮</button>
                <button class="carrusel-btn btn-next" id="btnNext">❯</button>
            </div>
            <div class="carrusel-dots" id="carruselDots"></div>

        </main>
    </div>

    <button id="btnModoOscuro" class="boton-modo">🌙</button>
    <button id="btnVolverArriba">⬆</button>

    <script src="script.js"></script>
    <script>
        // ========== CARRUSEL ==========
        const slides = document.querySelectorAll('.carrusel-slide');
        const slidesContainer = document.getElementById('carruselSlides');
        const prevBtn = document.getElementById('btnPrev');
        const nextBtn = document.getElementById('btnNext');
        const dotsContainer = document.getElementById('carruselDots');
        let currentIndex = 0;
        const totalSlides = slides.length;

        function createDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('span');
                dot.classList.add('dot');
                if (i === currentIndex) dot.classList.add('active');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, idx) => {
                if (idx === currentIndex) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        function goToSlide(index) {
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;
            currentIndex = index;
            slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
            updateDots();
        }

        function nextSlide() { goToSlide(currentIndex + 1); }
        function prevSlide() { goToSlide(currentIndex - 1); }

        nextBtn.addEventListener('click', nextSlide);
        prevBtn.addEventListener('click', prevSlide);
        createDots();

        // Auto-desplazamiento cada 5 segundos, se pausa al pasar el ratón
        let autoInterval = setInterval(nextSlide, 5000);
        const carrusel = document.querySelector('.carrusel-container');
        carrusel.addEventListener('mouseenter', () => clearInterval(autoInterval));
        carrusel.addEventListener('mouseleave', () => {
            autoInterval = setInterval(nextSlide, 5000);
        });
    </script>
</body>
</html>
